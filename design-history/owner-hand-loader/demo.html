<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hand Loader demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1eee6; color: #1c1a17; font: 16px system-ui, sans-serif; }
    h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 64px; margin: 0 0 16px; }
    button { padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(28, 26, 23, 0.25); background: none; cursor: pointer; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Your site is here.</h1>
    <button onclick="sessionStorage.clear(); location.reload()">Replay loader</button>
  </main>
  <script src="hand-loader.js"></script>
  <script>HandLoader.start({ name: "Vignesh B S" });</script>
</body>
</html>
